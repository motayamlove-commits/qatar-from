<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>انتهت صلاحية الرابط - مهرجان قطر الدولي للأغذية 2027</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', sans-serif;
      background: #FAF8F4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      max-width: 480px;
      width: 100%;
      padding: 40px 32px;
      text-align: center;
      border: 1px solid #eee;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    .icon {
      width: 72px; height: 72px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #FDECEC;
      color: #dc2626;
      display: flex; align-items: center; justify-content: center;
      font-size: 34px;
    }
    h1 { font-size: 1.3rem; color: #1a1a1a; margin-bottom: 12px; }
    p { color: #5a5a5a; line-height: 1.8; font-size: 0.98rem; }
    .btn {
      display: inline-block;
      margin-top: 24px;
      background: #00627B;
      color: #fff;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
    }
    .btn:hover { background: #004f63; }
    .footer { margin-top: 28px; font-size: 12px; color: #9aa0a6; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⏳</div>
    <h1>انتهت صلاحية رابط الدفع</h1>
    <p>انتهت مدة صلاحية رابط الدفع الخاص بك (7 أيام).<br>
       للاستمرار في تسديد رسوم التسجيل، يرجى التواصل معنا لإصدار رابط جديد.</p>
    <a href="/" class="btn">العودة للرئيسية</a>
    <div class="footer">قطر للسياحة — مهرجان قطر الدولي للأغذية 2027</div>
  </div>
</body>
</html>
